<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业品牌市场资料资产库</title><style>
:root{--ink:#37352f;--muted:#787774;--accent:#2383e2;--panel:#f7f6f3;--line:#e9e8e4}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,'Microsoft YaHei','PingFang SC',sans-serif;background:#fff;font-size:15px}button,input{font:inherit}button{cursor:pointer}header{height:70px;background:var(--panel);border-bottom:1px solid #e9e8e4;display:flex;align-items:center;padding:0 max(5%,calc((100% - 1320px)/2));font-size:17px;gap:14px}.brand-logo{display:block;width:150px;max-height:52px;object-fit:contain;object-position:left center}.divider{color:#bbb}.muted{color:var(--muted)}.mark{color:var(--accent);font-size:22px;font-weight:bold}.demo{margin-left:auto;font-size:12px;padding:5px 10px;border:1px solid #e0ded7;border-radius:20px;color:#787774}.hero{background:var(--panel);text-align:center;padding:38px 20px 42px}.hero h1{font-size:clamp(26px,3vw,42px);margin:0 0 12px;letter-spacing:.02em}.hero p{margin:0;color:var(--muted);font-size:15px}.search{display:flex;max-width:660px;margin:25px auto 0;background:white;border:1px solid #dededb;border-radius:8px;padding:4px;box-shadow:0 3px 14px #00000008}.search label{padding:10px;color:#777}.search input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--ink)}.search button,.primary{border:0;border-radius:6px;background:var(--accent);color:white;padding:10px 23px}.layout{max-width:1320px;margin:28px auto 64px;padding:0 24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}aside{background:var(--panel);border-radius:10px;padding:12px;position:sticky;top:18px}nav button{width:100%;border:0;background:transparent;text-align:left;color:#5d5b56;border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px}nav button:hover{background:#ebeae6}.subnav{padding:2px 0 7px 14px;border-left:1px solid #e0dfdb;margin-left:19px}.subnav button.subitem{font-size:13px;padding:8px 10px;color:#787774;line-height:1.4}.subnav button.subactive{color:#146dc5;background:#e4effb;font-weight:600}nav button.active{color:#146dc5;background:#e4effb;font-weight:600}main{min-height:480px;border:1px solid var(--line);border-radius:10px;padding:28px 32px}.eyebrow{font-size:12px;color:#85847e;margin-bottom:10px}.main-title{font-size:24px;margin:0 0 8px}.intro{color:var(--muted);line-height:1.7;margin:0 0 22px}.section-title{font-size:18px;margin:0 0 16px;display:flex;align-items:center;gap:10px}.section-title:before{content:'';height:19px;width:4px;border-radius:4px;background:var(--accent)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:var(--panel);border:1px solid transparent;text-align:left;border-radius:8px;padding:20px;color:var(--ink);min-height:128px}.card:hover{border-color:#cbdff1;transform:translateY(-1px)}.card-icon{font-size:22px;color:#2383e2;display:block;margin-bottom:16px}.card strong{font-size:15px}.card small{display:block;color:var(--muted);margin-top:7px;line-height:1.5}.rule{border:0;border-top:1px solid var(--line);margin:28px 0}.empty{padding:30px;text-align:center;color:#a1a09b;font-size:14px}.empty b{display:block;font-size:26px;margin-bottom:8px;color:#b8b7b1;font-weight:400}.subhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.subhead .section-title{margin:0}.tag{font-size:12px;color:#8c6c19;background:#fbf2d5;border-radius:5px;padding:4px 8px}.back{background:none;border:0;color:var(--accent);padding:0;margin:0 0 24px}.details{width:100%;max-width:none}.info{display:grid;grid-template-columns:110px 1fr;gap:14px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;margin:22px 0;line-height:1.6}.info span:nth-child(odd){color:var(--muted)}.notice{background:#faf6e7;padding:14px;border-radius:6px;font-size:13px;line-height:1.7}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.chip{border:1px solid #e5e4df;background:#fff;border-radius:20px;padding:6px 12px;color:#777}.chip.selected{color:#176dc2;background:#eaf3fd;border-color:#d7e9fb}.row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{background:none;border:0;color:var(--ink);text-align:left;font-weight:600}.row button:hover{color:var(--accent)}.row small{display:block;color:var(--muted);font-weight:400;margin-top:6px}.row .arrow{color:#aaa}footer{max-width:1320px;margin:0 auto;padding:0 24px 36px;color:#aaa;font-size:12px}@media(max-width:750px){.subnav{display:flex;flex-direction:column;position:static}.subnav button.subitem{white-space:nowrap}header{padding:0 18px}.hero{padding:30px 18px}.layout{display:block;padding:0 16px;margin-top:18px}aside{position:static;margin-bottom:16px;overflow:auto}nav{display:flex;width:max-content;gap:4px}nav button{width:auto;white-space:nowrap}nav button span:last-child{display:none}main{padding:23px 18px}.cards{grid-template-columns:1fr 1fr}.demo{font-size:11px}.info{grid-template-columns:90px 1fr}}
.admin-entry{background:white;border:1px solid #deded9;border-radius:7px;padding:8px 14px;color:#37352f}#text-entry,#admin-login{margin-left:auto}#admin-login{text-decoration:none;font-size:14px}[hidden]{display:none!important}.admin-entry:hover{border-color:#2383e2;color:#2383e2}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0 28px}.admin-form label{display:grid;gap:7px;color:#666;font-size:13px}.admin-form input,.admin-form select,.admin-form textarea{width:100%;border:1px solid #deded9;border-radius:6px;padding:10px;background:#fff;color:#37352f}.admin-form .full{grid-column:1/-1}.file-actions{display:flex;gap:14px;align-items:center}.file-actions a,.file-actions button{color:#2383e2;text-decoration:none;background:none;border:0;padding:4px}.file-actions button{color:#ad5149}.file-actions .move-button{color:#2383e2}.move-form{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px;margin:8px 0 14px;border-radius:8px;background:#f7f6f3}.move-form label{display:grid;gap:5px;font-size:13px;color:#787774}.move-form select{min-width:150px;max-width:100%;border:1px solid #deded9;border-radius:6px;padding:8px;background:#fff;color:#37352f}.move-form .primary{padding:8px 14px}.move-error{font-size:13px;color:#b44438}.move-note{width:100%;font-size:13px;color:#787774}.file-actions .preview-upload{color:#2383e2}.file-actions{flex-wrap:wrap;justify-content:flex-end}.preview-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.preview-form input{max-width:260px}.preview-form .primary{padding:8px 12px}.preview-help{font-size:12px;color:#787774;width:100%;line-height:1.6}.preview-status{font-size:13px}.error-text{color:#b44438}.success-text{color:#308052}.file-section{margin:24px 0}.file-heading{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.file-heading .section-title{margin:0}.rename-title,.rename-cancel{border:0;background:none;color:#2383e2;padding:6px;cursor:pointer}.rename-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.rename-form input{flex:1;min-width:180px;max-width:450px;border:1px solid #deded9;border-radius:6px;padding:9px;color:#37352f}.rename-form .primary{padding:9px 15px}.rename-error{font-size:13px;color:#b44438}.file-section .section-title{margin:0 0 8px}.file-name{font-weight:500;overflow-wrap:anywhere}.item-meta{color:#787774;font-size:12px;line-height:1.7;margin-top:6px}.status-text{min-height:22px;font-size:13px}@media(max-width:750px){.admin-form{grid-template-columns:1fr}.admin-form .full{grid-column:auto}} .page-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:15px;color:#37352f;margin:0 0 26px}.page-body:empty{display:none}.page-body h3{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.45;margin:24px 0 12px;color:#37352f}.page-body h3::before{content:'';width:4px;height:19px;flex:none;border-radius:4px;background:#2383e2}.page-body .body-text{white-space:pre-wrap;margin:0 0 1em;line-height:1.9}.page-body .body-text:last-child{margin-bottom:0}.title-tools{display:flex;gap:10px;align-items:end}.title-tools label{flex:1}.title-tools button{border:1px solid #d8d8d4;background:white;border-radius:6px;padding:10px 14px;color:#2383e2;white-space:nowrap}.title-tools button:hover{border-color:#2383e2}.text-editor{min-height:260px;resize:vertical;line-height:1.8}.helper-note{color:#787774;font-size:13px;line-height:1.7}</style></head><body><header><img class="brand-logo" src="shuntian-logo.png" alt="顺天装备"><span class="divider">│</span><span>知识库</span></header><section class="hero"><h1>企业品牌市场资料资产库</h1><p>统一管理品牌、产品、销售与传播资料，高效查找，便捷使用</p><form class="search" id="search"><label for="query">⌕</label><input id="query" placeholder="搜索企业介绍、产品资料、宣传素材等…" autocomplete="off"><button>搜索</button></form></section><div class="layout"><aside><nav id="nav" aria-label="资料分类"></nav></aside><main id="content" aria-live="polite"></main></div><footer>顺天装备 · 品牌市场资料资产库　 /　静态资料快照 · 更新日期：2026-11-12</footer><script>
const groups=[
['企业与品牌','公司简介|企业发展历程|企业定位与文化|业务范围|核心优势|企业宣传PPT|品牌口径'],
['产品与技术','产品分类|产品介绍|产品参数|产品图片|产品视频|产品应用案例|产品标准资料包'],
['销售与客户','销售常见问题|客户画像|客户案例|投标资料|技术交流资料|竞品分析|报价支持'],
['品牌传播','公众号文章|视频选题|行业观点|新闻稿模板|宣传海报|短视频脚本'],
['视觉与模板','Logo源文件|VI视觉规范|PPT模板|海报模板|公众号封面模板|视频包装模板'],
['行业与市场','政策法规|市场规模数据|行业趋势|技术路线|竞争企业研究|招投标信息'],
['渠道与活动','官网与平台资料|媒体联系人|行业展会|活动方案|活动物料|现场照片与视频|客户交流记录|活动复盘'],
['数据与知识','公众号数据|视频数据|客户来源统计|推广效果分析|AI知识库'],
['资料管理规范','资料分类与命名|版本与归档|权限分层|审核与更新|来源与使用授权'],
['使用帮助','查找资料|申请权限|反馈问题|维护联系人']].map(([name,items])=>({name,items:items.split('|')}));
const descriptions={'企业与品牌':'统一企业基础资料和对外品牌口径。','产品与技术':'集中查看产品介绍、技术资料和产品素材。','销售与客户':'支持客户沟通、销售与商务协作。','品牌传播':'积累传播内容、选题与可复用的文案。','视觉与模板':'查找品牌视觉规范、素材与工作模板。','行业与市场':'收录行业政策、市场与竞争研究资料。','渠道与活动':'整理传播渠道、展会和活动资料。','数据与知识':'沉淀市场数据及后续知识应用资料。','资料管理规范':'了解资料的命名、审核、权限和维护规则。','使用帮助':'了解如何查找资料及联系维护人员。'};
let current='首页', activeItem='', expandedGroup='';const nav=document.querySelector('#nav'),content=document.querySelector('#content');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderNav(){nav.innerHTML=`<button type="button" class="${current==='首页'?'active':''}" data-nav="首页"><span>首页</span><span>›</span></button>`+groups.map(g=>`<button type="button" class="${current===g.name?'active':''}" data-nav="${esc(g.name)}" aria-expanded="${expandedGroup===g.name}"><span>${esc(g.name)}</span><span>${expandedGroup===g.name?'⌄':'›'}</span></button>${expandedGroup===g.name?`<div class="subnav">${g.items.map(it=>`<button type="button" class="subitem ${activeItem===it?'subactive':''}" data-open="${esc(g.name)}" data-item="${esc(it)}" ${activeItem===it?'aria-current="page"':''}>${esc(it)}</button>`).join('')}</div>`:''}`).join('')}
function home(){current='首页';activeItem='';expandedGroup='';renderNav();content.innerHTML=`<div class="subhead"><h2 class="section-title">常用资料</h2><span class="tag">示例入口</span></div><div class="cards"><button class="card" data-open="企业与品牌" data-item="公司简介"><span class="card-icon">▤</span><strong>公司简介</strong><small>企业基础介绍资料</small></button><button class="card" data-open="产品与技术" data-item="产品介绍"><span class="card-icon">▧</span><strong>产品介绍</strong><small>查找产品与应用资料</small></button><button class="card" data-open="视觉与模板" data-item="PPT模板"><span class="card-icon">▣</span><strong>宣传模板</strong><small>常用演示及传播模板</small></button></div><hr class="rule"><h2 class="section-title">最近更新</h2><div class="empty"><b>▤</b>暂无更新资料<br><small>正式接入资料后将在此显示</small></div>`}
function category(name){let g=groups.find(x=>x.name===name);if(!g)return home();current=name;activeItem='';expandedGroup=name;renderNav();content.innerHTML=`<div class="subhead"><h2 class="section-title">资料分类</h2></div><div class="cards">${g.items.map((it,i)=>`<button class="card" data-open="${esc(name)}" data-item="${esc(it)}"><span class="card-icon">${['▤','▧','▣'][i%3]}</span><strong>${esc(it)}</strong><small>查看相关资料与说明 →</small></button>`).join('')}</div>`}
function detail(name,item){current=name;activeItem=item;expandedGroup=name;renderNav();content.innerHTML=`<button class="back" data-nav="${esc(name)}">← 返回${esc(name)}</button><div class="details"><div class="empty"><b>▤</b>暂无资料<br><small>正式接入后可在此查看和下载</small></div><div class="notice">示意页面：真实文件、权限、版本及下载功能将在后续建设阶段接入。</div></div>`}
function results(q){let term=q.trim().toLowerCase();if(!term){home();return}current='';activeItem='';expandedGroup='';renderNav();let matches=groups.flatMap(g=>g.items.filter(i=>(i+g.name).toLowerCase().includes(term)).map(i=>({g:g.name,i})));content.innerHTML=`<div class="eyebrow">资料中心 / 搜索</div><h2 class="main-title">搜索结果</h2><p class="intro">关键词：${esc(q)}　·　以下为分类规划中的匹配项</p>${matches.length?matches.map(x=>`<div class="row"><button data-open="${esc(x.g)}" data-item="${esc(x.i)}">${esc(x.i)}<small>${esc(x.g)} · 分类示意</small></button><span class="arrow">›</span></div>`).join(''):'<div class="empty"><b>⌕</b>没有找到匹配的分类，请尝试其他关键词</div>'}`}
nav.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.open)detail(b.dataset.open,b.dataset.item);else if(b.dataset.nav){if(b.dataset.nav==='首页')home();else if(expandedGroup===b.dataset.nav){expandedGroup='';renderNav()}else category(b.dataset.nav)}});content.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav)category(b.dataset.nav);else if(b.dataset.open)detail(b.dataset.open,b.dataset.item)});document.querySelector('#search').addEventListener('submit',e=>{e.preventDefault();results(document.querySelector('#query').value)});home();
</script>
